[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "relaygpu-client"
version = "0.1.0"
description = "Python client for the Relay API: image, video and audio generation, tasks, files, webhooks, workflows and typed errors."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "OpenGPU Network" }]
keywords = ["relay", "relaygpu", "ai", "inference", "image-generation", "video-generation", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://relaygpu.com"
Repository = "https://github.com/OpenGPU-Network/relaygpu-python"

[tool.hatch.build.targets.sdist]
include = ["relaygpu", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["relaygpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: billed calls against staging (RELAY_BASE_URL); deselected by default, run with -m e2e"]
addopts = "-m 'not e2e'"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["relaygpu"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["relaygpu/_generated", "relaygpu/_sync"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "UP007"]
